<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</head>

<body>
  <div class="d-flex justify-content-end m-5">
    <button class="btn btn-primary " data-bs-toggle="modal" data-bs-target="#addStudent">Add Student</button>
  </div>


  <div class="modal fade" id="addStudent" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">

        <form action="/insert" method="post" class="p-4">
          <p class="text-center fs-2 fw-bold">Add Student </p>

          <label for="" class="form-label">Enter Name</label>
          <input type="text" name="name" class="form-control">
          <label for="" class="form-label">Enter Age</label>
          <input type="number" name="age" class="form-control">

          <div class="d-flex gap-3 w-100">
            <div class="w-50">
              <label for="" class="form-label">Enter Gender</label>
              <input type="text" name="gender" class="form-control">
            </div>
            <div class="w-50">
              <label for="" class="form-label">Enter Grade</label>
              <input type="text" name="grade" class="form-control">
            </div>




          </div>

          <div class="d-flex justify-content-end gap-1 mt-2">
            <button class="btn btn-secondary">Cancel</button>
            <button class="btn btn-primary" type="submit">Submit</button>
          </div>


        </form>



      </div>
    </div>
  </div>
  <div class="d-flex justify-content-center align-items-center ">

    <table class="table w-50 text-center table-bordered ">
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Name</th>
          <th scope="col">Age</th>
          <th scope="col">Gender</th>
          <th scope="col">Grade</th>
          <th scope="col">Action</th>

        </tr>
      </thead>
      <tbody>
        {% for mydata in data %}
        <tr>
          <th scope="row">{{mydata[0]}}</th>
          <td>{{mydata[1]}}</td>
          <td>{{mydata[2]}}</td>
          <td>{{mydata[3]}}</td>
          <td>{{mydata[4]}}</td>
          <td>
            <button class="btn btn-danger" data-bs-target="#delete{{mydata[0]}}" data-bs-toggle="modal">delete</button>
            <button class="btn btn-warning" data-bs-target="#update{{mydata[0]}}" data-bs-toggle="modal">update</button>
          </td>
        </tr>


        <div class="modal fade" id="delete{{mydata[0]}}" tabindex="-1" aria-labelledby="exampleModalLabel"
          aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content p-4">
              <form action="/delete" method="post">
                <input type="hidden" name="delete_id" value="{{mydata[0]}}">
                <p class="text-center fs-2 fw-bold text-danger">Are you sure delete ?</p>
                <div class="d-flex justify-content-center gap-1 mt-2">
                  <button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Cancel</button>
                  <button class="btn btn-primary" type="submit">delete</button>
                </div>


              </form>



            </div>
          </div>
          </div>





          <div class="modal fade" id="update{{mydata[0]}}" tabindex="-1" aria-labelledby="exampleModalLabel"
            aria-hidden="true">
            <div class="modal-dialog">
              <div class="modal-content p-4">

                <form action="/update" method="post" class="">
                  <p class="text-center fs-2 fw-bold">Update Student </p>

                  <input type="hidden" name="update_id" value="{{mydata[0]}}">
                  <label for="" class="form-label">Enter Name</label>
                  <input type="text" value="{{mydata[1]}}" name="update_name" class="form-control">
                  <label for="" class="form-label">Enter Age</label>
                  <input type="number" name="update_age" value="{{mydata[2]}}" class="form-control">

                  <div class="d-flex gap-3 w-100">
                    <div class="w-50">
                      <label for="" class="form-label">Enter Gender</label>
                      <input type="text" name="update_gender" value="{{mydata[3]}}" class="form-control">
                    </div>
                    <div class="w-50">
                      <label for="" class="form-label">Enter Grade</label>
                      <input type="text" name="update_grade" value="{{mydata[4]}}" class="form-control">
                    </div>




                  </div>

                  <div class="d-flex justify-content-end gap-1 mt-2">
                    <button class="btn btn-secondary">Cancel</button>
                    <button class="btn btn-primary" type="submit">Submit</button>
                  </div>


                </form>



              </div>
            </div>
          </div>

          {% endfor %}

      </tbody>
    </table>
  </div>




</body>

</html>
